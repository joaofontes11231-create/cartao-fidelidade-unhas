<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel da Manicure - Fidelidade</title>
    <!-- Leitor de QR Code por câmera -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #f4f4f9; }
        .box { background: white; padding: 25px; border-radius: 10px; max-width: 360px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        #reader { width: 100%; max-width: 300px; margin: auto; }
        button { padding: 10px 20px; font-size: 16px; margin: 5px; cursor: pointer; border: none; border-radius: 5px; }
        input { padding: 10px; font-size: 16px; width: 80%; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN EXCLUSIVA DA DONA -->
    <div id="tela-login" class="box">
        <h2>🔒 Área Restrita</h2>
        <p>Digite sua senha de acesso:</p>
        <input type="password" id="senha-input" placeholder="Senha">
        <br>
        <button onclick="fazerLogin()" style="background: #4CAF50; color: white;">Entrar</button>
        <p id="erro-login" style="color: red;"></p>
    </div>

    <!-- PAINEL DE LEITURA -->
    <div id="tela-painel" class="box" style="display:none;">
        <h2>📸 Escanear Cliente</h2>
        <div id="reader"></div>
        
        <div id="painel-cliente" style="display:none; margin-top: 15px;">
            <h3 id="info-nome"></h3>
            <p>Telefone: <span id="info-tel"></span></p>
            <p>Corações: <span id="qtd-coracoes" style="font-size: 28px; font-weight: bold; color: #ff3366;">0</span></p>
            <button onclick="alterarCoracao('adicionar')" style="background: #4CAF50; color: white;">➕ Dar Coração</button>
            <button onclick="alterarCoracao('remover')" style="background: #f44336; color: white;">➖ Remover</button>
            <br><br>
            <button onclick="reiniciarScanner()" style="background: #2196F3; color: white;">Escanear Outro</button>
        </div>
    </div>

    <script>
        let telefoneAtual = "";
        let html5QrcodeScanner = null;

        async function fazerLogin() {
            const senha = document.getElementById('senha-input').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ senha })
            });
            const data = await res.json();

            if (data.sucesso) {
                document.getElementById('tela-login').style.display = 'none';
                document.getElementById('tela-painel').style.display = 'block';
                iniciarScanner();
            } else {
                document.getElementById('erro-login').innerText = "Senha incorreta!";
            }
        }

        function iniciarScanner() {
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            html5QrcodeScanner.render(onScanSuccess);
        }

        async function onScanSuccess(decodedText) {
            telefoneAtual = decodedText.trim();
            if (html5QrcodeScanner) {
                await html5QrcodeScanner.clear();
            }
            carregarPainelCliente(telefoneAtual);
        }

        async function carregarPainelCliente(tel) {
            const res = await fetch(`/api/cliente/${tel}`);
            const data = await res.json();
            document.getElementById('info-nome').innerText = `Cliente: ${data.nome || 'Cliente'}`;
            document.getElementById('info-tel').innerText = data.telefone;
            document.getElementById('qtd-coracoes').innerText = data.coracoes;
            document.getElementById('reader').style.display = 'none';
            document.getElementById('painel-cliente').style.display = 'block';
        }

        async function alterarCoracao(acao) {
            const res = await fetch('/api/atualizar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telefone: telefoneAtual, acao })
            });
            const data = await res.json();
            document.getElementById('qtd-coracoes').innerText = data.coracoes;
        }

        function reiniciarScanner() {
            document.getElementById('painel-cliente').style.display = 'none';
            document.getElementById('reader').style.display = 'block';
            iniciarScanner();
        }
    </script>
</body>
</html>
