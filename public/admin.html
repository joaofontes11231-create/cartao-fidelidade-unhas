<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Brendha Elias - Painel</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            padding: 16px;
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #1f1910 0%, #0b0b0d 75%);
            color: #f5e6c4;
        }
        .box {
            background: #141417;
            border: 1px solid rgba(212, 175, 55, 0.45);
            padding: 24px 20px;
            border-radius: 18px;
            width: 100%;
            max-width: 410px;
            margin: 16px auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65), 0 0 18px rgba(212, 175, 55, 0.12);
        }
        .logo-topo {
            width: 100%;
            max-width: 210px;
            height: auto;
            border-radius: 12px;
            margin: 0 auto 12px auto;
            display: block;
            border: 1px solid rgba(212, 175, 55, 0.35);
        }
        h2 {
            color: #e5c158;
            margin: 6px 0 12px 0;
            font-size: 21px;
        }
        #reader {
            width: 100%;
            max-width: 320px;
            margin: 12px auto;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.35);
            display: none;
        }

        .pad-wrapper {
            position: relative;
            width: 240px;
            height: 240px;
            margin: 14px auto;
            background: #0d0d10;
            border: 1px solid rgba(212, 175, 55, 0.35);
            border-radius: 16px;
            touch-action: none;
        }
        .pad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
        }
        .pad-cell {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pad-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #2a261f;
            border: 2px solid rgba(212, 175, 55, 0.5);
            transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
        }
        .pad-dot.ativo {
            background: #f5d061;
            transform: scale(1.25);
            box-shadow: 0 0 12px rgba(245, 208, 97, 0.85);
        }
        #pad-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .metricas-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 14px 0 14px 0;
        }
        .metrica-card {
            background: #0d0d10;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            padding: 12px 10px;
        }
        .metrica-valor {
            font-size: 24px;
            font-weight: bold;
            color: #f5d061;
            display: block;
        }
        .metrica-label {
            font-size: 12px;
            color: #cbb88a;
            margin-top: 4px;
            display: block;
        }

        button {
            padding: 11px 16px;
            font-size: 15px;
            font-weight: bold;
            margin: 6px 0;
            cursor: pointer;
            border: none;
            border-radius: 10px;
        }
        .btn-dourado {
            background: linear-gradient(135deg, #d4af37, #f5d061, #b88b1e);
            color: #111;
            width: 100%;
        }
        .btn-secundario {
            background: #25252b;
            color: #f5d061;
            border: 1px solid rgba(212, 175, 55, 0.4);
            width: 100%;
        }
        .btn-add {
            background: #2e7d32;
            color: #fff;
            margin: 4px;
        }
        .btn-rem {
            background: #c62828;
            color: #fff;
            margin: 4px;
        }
        .btn-scan {
            background: #25252b;
            color: #f5d061;
            border: 1px solid rgba(212, 175, 55, 0.45);
            width: 100%;
        }
        input {
            padding: 11px 14px;
            font-size: 15px;
            width: 100%;
            margin-bottom: 10px;
            background: #0d0d10;
            color: #fff;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 10px;
            outline: none;
        }
        #msg-completo {
            color: #f5d061;
            font-weight: bold;
            margin-top: 10px;
            min-height: 22px;
        }
        .aviso-bloqueio {
            color: #ef9a9a;
            background: rgba(198, 40, 40, 0.16);
            border: 1px solid rgba(198, 40, 40, 0.45);
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            margin-top: 10px;
        }
        .motivo-bloqueio {
            margin-top: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #f5e6c4;
        }
        .subaviso-bloqueio {
            margin-top: 4px;
            font-size: 12px;
            color: #cbb88a;
        }
    </style>
</head>
<body>

    <div id="tela-bloqueio" class="box" style="display:none;">
        <img src="logo-brendha.jpg" alt="Studio Brendha Elias" class="logo-topo" onerror="this.style.display='none'">
        <h2>Studio Brendha Elias</h2>
        <div class="aviso-bloqueio">Acesso temporariamente suspenso.</div>
        <div id="motivo-bloqueio" class="motivo-bloqueio" style="display:none;"></div>
        <div id="subaviso-bloqueio" class="subaviso-bloqueio">Em breve nós voltamos</div>
    </div>

    <div id="tela-login" class="box">
        <img src="logo-brendha.jpg" alt="Studio Brendha Elias" class="logo-topo" onerror="this.style.display='none'">
        <h2>Studio Brendha Elias</h2>
        <p style="color:#cbb88a; margin:0 0 8px 0; font-size:14px;">Arraste o dedo pelos pontos para desbloquear:</p>

        <div class="pad-wrapper" id="pad-wrapper">
            <canvas id="pad-canvas" width="240" height="240"></canvas>
            <div class="pad-grid" id="pad-grid">
                <div class="pad-cell" data-idx="1"><div class="pad-dot"></div></div>
                <div class="pad-cell" data-idx="2"><div class="pad-dot"></div></div>
                <div class="pad-cell" data-idx="3"><div class="pad-dot"></div></div>
                <div class="pad-cell" data-idx="4"><div class="pad-dot"></div></div>
                <div class="pad-cell" data-idx="5"><div class="pad-dot"></div></div>
                <div class="pad-cell" data-idx="6"><div class="pad-dot"></div></div>
                <div class="pad-cell" data-idx="7"><div class="pad-dot"></div></div>
                <div class="pad-cell" data-idx="8"><div class="pad-dot"></div></div>
                <div class="pad-cell" data-idx="9"><div class="pad-dot"></div></div>
            </div>
        </div>

        <p id="pad-status" style="font-size:13px; color:#cbb88a; margin:6px 0 10px 0;">Padrão: nenhum</p>
        <button type="button" onclick="limparPad()" class="btn-secundario">Limpar Traço</button>

        <div id="area-senha-extra" style="display:none; margin-top:12px;">
            <input type="password" id="senha-input" placeholder="Digite a senha do painel">
            <button type="button" onclick="fazerLogin()" class="btn-dourado">Entrar</button>
        </div>

        <p id="erro-login" style="color: #ff6b6b; margin-top: 10px;"></p>
    </div>

    <div id="tela-painel" class="box" style="display:none;">
        <img src="logo-brendha.jpg" alt="Studio Brendha Elias" class="logo-topo" onerror="this.style.display='none'">
        <h2>Painel do Studio</h2>

        <div class="metricas-grid">
            <div class="metrica-card">
                <span class="metrica-valor" id="total-clientes">0</span>
                <span class="metrica-label">Clientes com cartão</span>
            </div>
            <div class="metrica-card">
                <span class="metrica-valor" id="clientes-meta">0</span>
                <span class="metrica-label">Meta de 7 concluída</span>
            </div>
        </div>

        <button type="button" class="btn-dourado" onclick="window.location.href='clientes.html'">Ver Todas as Clientes</button>

        <h3 style="color:#e5c158; margin:14px 0 6px 0; font-size:18px;">Escanear QR Code</h3>
        <button type="button" id="btn-abrir-camera" class="btn-scan" onclick="alternarCamera()">📷 Abrir Câmera para Escanear</button>
        <div id="reader"></div>
        <p id="erro-camera" style="color:#ff6b6b; font-size:13px;"></p>

        <div id="painel-cliente" style="display:none; margin-top: 15px;">
            <h3 id="info-nome" style="color:#fff; margin-bottom:6px;"></h3>
            <p style="margin:4px 0; color:#cbb88a;">Telefone: <span id="info-tel" style="color:#fff;"></span></p>
            <p style="margin:10px 0 4px 0;">Corações: <span id="qtd-coracoes" style="font-size: 28px; font-weight: bold; color: #f5d061;">0</span> / 7</p>

            <div id="grid-coracoes-admin" style="margin: 14px 0; font-size: 26px;"></div>

            <div>
                <button type="button" onclick="alterarCoracao('adicionar')" class="btn-add">➕ Dar Coração</button>
                <button type="button" onclick="alterarCoracao('remover')" class="btn-rem">➖ Remover</button>
            </div>

            <p id="msg-completo"></p>

            <button type="button" onclick="reiniciarScanner()" class="btn-scan">📷 Escanear Outro</button>
        </div>
    </div>

    <script>
        const META_CORACOES = 7;
        const ORDEM_TRACO_DONA = "1-2-3-6-9-8-7-4";
        const TEXTO_VOLTA = "Em breve nós voltamos";
        let telefoneAtual = "";
        let html5QrCode = null;
        let scannerRodando = false;
        let autenticado = false;
        const mapaClientesLocal = new Map();

        let desenhando = false;
        let sequenciaPad = [];
        let ultimoPontoAtual = null;

        const padWrapper = document.getElementById('pad-wrapper');
        const canvas = document.getElementById('pad-canvas');
        const ctx = canvas.getContext('2d');
        const cells = Array.from(document.querySelectorAll('.pad-cell'));

        function mostrarBloqueio(bloqueado, motivo = '') {
            const telaBloqueio = document.getElementById('tela-bloqueio');
            const telaLogin = document.getElementById('tela-login');
            const telaPainel = document.getElementById('tela-painel');
            const motivoEl = document.getElementById('motivo-bloqueio');
            const subavisoEl = document.getElementById('subaviso-bloqueio');

            if (bloqueado) {
                pararScanner();
                telaBloqueio.style.display = 'block';
                telaLogin.style.display = 'none';
                telaPainel.style.display = 'none';
                motivoEl.style.display = motivo ? 'block' : 'none';
                motivoEl.innerText = motivo || '';
                subavisoEl.style.display = 'block';
                subavisoEl.innerText = TEXTO_VOLTA;
            } else {
                telaBloqueio.style.display = 'none';
                if (!autenticado) {
                    telaLogin.style.display = 'block';
                }
            }
        }

        async function verificarStatus() {
            try {
                const res = await fetch('/api/status');
                if (res.ok) {
                    const data = await res.json();
                    mostrarBloqueio(data.ativo === false, data.motivo || '');
                }
            } catch (e) {}
        }

        function getCentroCelula(cell) {
            const rectCell = cell.getBoundingClientRect();
            const rectPad = padWrapper.getBoundingClientRect();
            return {
                x: rectCell.left - rectPad.left + rectCell.width / 2,
                y: rectCell.top - rectPad.top + rectCell.height / 2
            };
        }

        function redesenharTraco(pontoExtra = null) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (sequenciaPad.length === 0) return;

            ctx.beginPath();
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = 'rgba(245, 208, 97, 0.85)';

            sequenciaPad.forEach((idx, i) => {
                const cell = cells.find(c => c.dataset.idx === String(idx));
                const centro = getCentroCelula(cell);
                if (i === 0) ctx.moveTo(centro.x, centro.y);
                else ctx.lineTo(centro.x, centro.y);
            });

            if (pontoExtra) {
                ctx.lineTo(pontoExtra.x, pontoExtra.y);
            }
            ctx.stroke();
        }

        function detectarCelulaPorCoordenada(clientX, clientY) {
            for (const cell of cells) {
                const rect = cell.getBoundingClientRect();
                const margem = 10;
                if (
                    clientX >= rect.left - margem &&
                    clientX <= rect.right + margem &&
                    clientY >= rect.top - margem &&
                    clientY <= rect.bottom + margem
                ) {
                    return cell;
                }
            }
            return null;
        }

        function adicionarPontoPad(cell) {
            const idx = cell.dataset.idx;
            if (!sequenciaPad.includes(idx)) {
                sequenciaPad.push(idx);
                cell.querySelector('.pad-dot').classList.add('ativo');
                document.getElementById('pad-status').innerText = `Traço: ${sequenciaPad.join(' → ')}`;
                redesenharTraco(ultimoPontoAtual);
            }
        }

        function limparPad() {
            sequenciaPad = [];
            ultimoPontoAtual = null;
            cells.forEach(c => c.querySelector('.pad-dot').classList.remove('ativo'));
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('pad-status').innerText = "Padrão: nenhum";
            document.getElementById('erro-login').innerText = "";
        }

        padWrapper.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            limparPad();
            desenhando = true;
            padWrapper.setPointerCapture(e.pointerId);

            const rectPad = padWrapper.getBoundingClientRect();
            ultimoPontoAtual = { x: e.clientX - rectPad.left, y: e.clientY - rectPad.top };

            const cell = detectarCelulaPorCoordenada(e.clientX, e.clientY);
            if (cell) adicionarPontoPad(cell);
        });

        padWrapper.addEventListener('pointermove', (e) => {
            if (!desenhando) return;
            const rectPad = padWrapper.getBoundingClientRect();
            ultimoPontoAtual = { x: e.clientX - rectPad.left, y: e.clientY - rectPad.top };

            const cell = detectarCelulaPorCoordenada(e.clientX, e.clientY);
            if (cell) adicionarPontoPad(cell);
            redesenharTraco(ultimoPontoAtual);
        });

        async function autenticarNoServidor(senha) {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ senha })
            });

            if (res.status === 403) {
                const d = await res.json().catch(() => ({}));
                mostrarBloqueio(true, d.motivo || '');
                return false;
            }

            const data = await res.json();
            return Boolean(data.sucesso);
        }

        async function finalizarArrasto() {
            if (!desenhando) return;
            desenhando = false;
            ultimoPontoAtual = null;
            redesenharTraco(null);

            if (sequenciaPad.length < 3) {
                document.getElementById('erro-login').innerText = "Arraste pelos pontos na ordem correta.";
                return;
            }

            const tracoFeito = sequenciaPad.join('-');

            if (tracoFeito === ORDEM_TRACO_DONA) {
                await verificarStatus();
                if (document.getElementById('tela-bloqueio').style.display !== 'block') {
                    await abrirPainelPrincipal();
                }
                return;
            }

            try {
                const ok = await autenticarNoServidor(tracoFeito);
                if (ok) {
                    await abrirPainelPrincipal();
                    return;
                }
            } catch (e) {}

            document.getElementById('area-senha-extra').style.display = 'block';
            document.getElementById('erro-login').innerText =
                "Sequência incorreta. Tente novamente ou digite a senha abaixo.";
        }

        padWrapper.addEventListener('pointerup', finalizarArrasto);
        padWrapper.addEventListener('pointercancel', finalizarArrasto);

        async function fazerLogin() {
            const senha = document.getElementById('senha-input').value;
            const ok = await autenticarNoServidor(senha);
            if (ok) {
                await abrirPainelPrincipal();
            } else {
                document.getElementById('erro-login').innerText = "Senha incorreta!";
            }
        }

        async function abrirPainelPrincipal() {
            autenticado = true;
            document.getElementById('tela-login').style.display = 'none';
            document.getElementById('tela-painel').style.display = 'block';
            await atualizarMetricasClientes();
        }

        async function atualizarMetricasClientes() {
            try {
                const res = await fetch('/api/clientes');
                if (res.status === 403) {
                    const d = await res.json().catch(() => ({}));
                    mostrarBloqueio(true, d.motivo || '');
                    return;
                }
                if (res.ok) {
                    const clientes = await res.json();
                    if (Array.isArray(clientes)) {
                        clientes.forEach(c => {
                            if (c && c.telefone) {
                                mapaClientesLocal.set(String(c.telefone), Number(c.coracoes || 0));
                            }
                        });
                    }
                }
            } catch (e) {}

            const valores = Array.from(mapaClientesLocal.values());
            renderizarContadores(valores.length, valores.filter(q => q >= META_CORACOES).length);
        }

        function renderizarContadores(total, concluidos) {
            document.getElementById('total-clientes').innerText = total;
            document.getElementById('clientes-meta').innerText = concluidos;
        }

        async function alternarCamera() {
            if (scannerRodando) {
                await pararScanner();
                document.getElementById('reader').style.display = 'none';
                document.getElementById('btn-abrir-camera').innerText = '📷 Abrir Câmera para Escanear';
            } else {
                await iniciarScanner();
            }
        }

        async function iniciarScanner() {
            document.getElementById('erro-camera').innerText = "";
            document.getElementById('reader').style.display = 'block';
            document.getElementById('btn-abrir-camera').innerText = '✖ Fechar Câmera';

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            if (scannerRodando) return;

            try {
                await html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 220, height: 220 } },
                    onScanSuccess,
                    () => {}
                );
                scannerRodando = true;
            } catch (err) {
                document.getElementById('erro-camera').innerText =
                    "Não foi possível abrir a câmera traseira. Verifique a permissão do navegador.";
            }
        }

        async function pararScanner() {
            if (html5QrCode && scannerRodando) {
                try {
                    await html5QrCode.stop();
                    scannerRodando = false;
                } catch (e) {}
            }
        }

        async function onScanSuccess(decodedText) {
            telefoneAtual = decodedText.trim();
            await pararScanner();
            document.getElementById('reader').style.display = 'none';
            document.getElementById('btn-abrir-camera').innerText = '📷 Abrir Câmera para Escanear';
            carregarPainelCliente(telefoneAtual);
        }

        async function carregarPainelCliente(tel) {
            const res = await fetch(`/api/cliente/${encodeURIComponent(tel)}`);
            if (res.status === 403) {
                const d = await res.json().catch(() => ({}));
                mostrarBloqueio(true, d.motivo || '');
                return;
            }
            const data = await res.json();
            const coracoes = Number(data.coracoes || 0);
            const telFinal = String(data.telefone || tel);

            mapaClientesLocal.set(telFinal, coracoes);
            await atualizarMetricasClientes();

            document.getElementById('info-nome').innerText = `Cliente: ${data.nome || 'Cliente'}`;
            document.getElementById('info-tel').innerText = telFinal;
            document.getElementById('qtd-coracoes').innerText = coracoes;
            atualizarVisualAdmin(coracoes, META_CORACOES);

            document.getElementById('painel-cliente').style.display = 'block';
        }

        async function alterarCoracao(acao) {
            const res = await fetch('/api/atualizar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telefone: telefoneAtual, acao })
            });
            if (res.status === 403) {
                const d = await res.json().catch(() => ({}));
                mostrarBloqueio(true, d.motivo || '');
                return;
            }
            const data = await res.json();
            const coracoes = Number(data.coracoes || 0);

            mapaClientesLocal.set(String(telefoneAtual), coracoes);
            await atualizarMetricasClientes();

            document.getElementById('qtd-coracoes').innerText = coracoes;
            atualizarVisualAdmin(coracoes, META_CORACOES);
        }

        function atualizarVisualAdmin(coracoesAtuais, maxCoracoes = META_CORACOES) {
            let html = '';
            for (let i = 0; i < maxCoracoes; i++) {
                if (i < coracoesAtuais) {
                    html += '<span style="color: #f5c136;">💛</span> ';
                } else {
                    html += '<span style="color: #444038;">🤍</span> ';
                }
            }
            const grid = document.getElementById('grid-coracoes-admin');
            if (grid) grid.innerHTML = html;

            const msgEl = document.getElementById('msg-completo');
            if (coracoesAtuais >= maxCoracoes) {
                msgEl.innerText = "parabéns, você completou seu cartão 🎉";
            } else {
                msgEl.innerText = "";
            }
        }

        async function reiniciarScanner() {
            document.getElementById('painel-cliente').style.display = 'none';
            document.getElementById('msg-completo').innerText = "";
            await iniciarScanner();
        }

        verificarStatus();
    </script>
</body>
</html>
