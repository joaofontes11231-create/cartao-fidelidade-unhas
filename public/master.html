<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Master</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            padding: 16px;
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #1f1910 0%, #0b0b0d 75%);
            color: #f5e6c4;
        }
        .box {
            background: #141417;
            border: 1px solid rgba(212, 175, 55, 0.45);
            padding: 24px 20px;
            border-radius: 18px;
            width: 100%;
            max-width: 460px;
            margin: 16px auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65);
        }
        h2, h3 { color: #e5c158; margin-top: 0; }
        input {
            width: 100%;
            padding: 12px 14px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            background: #0d0d10;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        button {
            padding: 11px 14px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-full { width: 100%; margin-top: 8px; font-size: 15px; padding: 12px; }
        .btn-ouro {
            background: linear-gradient(135deg, #d4af37, #f5d061, #b88b1e);
            color: #111;
        }
        .btn-bloquear { background: #c62828; color: #fff; }
        .btn-desbloquear { background: #2e7d32; color: #fff; }
        .btn-atualizar {
            background: #25252b;
            color: #f5d061;
            border: 1px solid rgba(212, 175, 55, 0.4);
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 14px 0;
        }
        .info-card {
            background: #0d0d10;
            border: 1px solid rgba(212, 175, 55, 0.28);
            border-radius: 12px;
            padding: 12px 10px;
        }
        .info-valor {
            display: block;
            font-size: 18px;
            font-weight: bold;
            color: #f5d061;
        }
        .info-rotulo {
            display: block;
            font-size: 12px;
            color: #cbb88a;
            margin-top: 4px;
        }
        .lista-clientes {
            margin-top: 12px;
            text-align: left;
            max-height: 360px;
            overflow-y: auto;
        }
        .cliente-card {
            background: #0d0d10;
            border: 1px solid rgba(212, 175, 55, 0.22);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .cliente-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .cliente-nome { font-weight: bold; color: #fff; font-size: 14px; display: block; }
        .cliente-tel { color: #cbb88a; font-size: 12px; display: block; }
        .cliente-coracoes { color: #f5d061; font-weight: bold; font-size: 14px; white-space: nowrap; }
        .cliente-acoes {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }
        .btn-add { background: #2e7d32; color: #fff; padding: 8px; font-size: 12px; }
        .btn-rem { background: #8d6e00; color: #fff; padding: 8px; font-size: 12px; }
        .btn-del { background: #c62828; color: #fff; padding: 8px; font-size: 12px; }
        #msg-login, #msg-acao {
            margin-top: 10px;
            font-size: 14px;
            color: #f5d061;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="box" id="box-login">
        <h2>Acesso Master</h2>
        <input type="password" id="senha-mestra" placeholder="Senha do proprietário">
        <button type="button" class="btn-ouro btn-full" onclick="entrar()">Entrar</button>
        <p id="msg-login"></p>
    </div>

    <div class="box" id="box-painel" style="display:none;">
        <h2 id="nome-site">Studio Brendha Elias</h2>

        <div class="info-grid">
            <div class="info-card">
                <span class="info-valor" id="status-conexao">-</span>
                <span class="info-rotulo">Conexão</span>
            </div>
            <div class="info-card">
                <span class="info-valor" id="status-licenca">-</span>
                <span class="info-rotulo">Estado do site</span>
            </div>
            <div class="info-card">
                <span class="info-valor" id="total-clientes">0</span>
                <span class="info-rotulo">Clientes</span>
            </div>
            <div class="info-card">
                <span class="info-valor" id="total-concluidos">0</span>
                <span class="info-rotulo">Meta de 7 concluída</span>
            </div>
        </div>

        <button type="button" id="btn-bloqueio" class="btn-full" onclick="alternarLicenca()">...</button>
        <button type="button" class="btn-atualizar btn-full" onclick="carregarPainel()">Atualizar Dados</button>
        <p id="msg-acao"></p>

        <h3 style="margin-top:18px; font-size:17px;">Clientes</h3>
        <div class="lista-clientes" id="lista-clientes"></div>
    </div>

    <script>
        let senhaSalva = '';
        let siteAtivo = true;

        function escaparTexto(texto) {
            const div = document.createElement('div');
            div.textContent = String(texto ?? '');
            return div.innerHTML;
        }

        async function entrar() {
            const senha = document.getElementById('senha-mestra').value.trim();
            const msg = document.getElementById('msg-login');
            if (!senha) {
                msg.innerText = 'Digite a senha do proprietário.';
                return;
            }
            senhaSalva = senha;
            await carregarPainel(true);
        }

        async function carregarPainel(primeiroAcesso = false) {
            try {
                const res = await fetch('/api/mestre/painel', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ senhaMestra: senhaSalva })
                });
                const data = await res.json();

                if (!res.ok || !data.sucesso) {
                    if (primeiroAcesso) {
                        document.getElementById('msg-login').innerText = data.erro || 'Acesso negado.';
                    } else {
                        document.getElementById('msg-acao').innerText = data.erro || 'Acesso negado.';
                    }
                    return;
                }

                document.getElementById('box-login').style.display = 'none';
                document.getElementById('box-painel').style.display = 'block';

                siteAtivo = Boolean(data.site?.ativo);
                document.getElementById('nome-site').innerText = data.site?.nome || 'Studio Brendha Elias';
                document.getElementById('status-conexao').innerText = data.site?.online ? 'Online' : 'Offline';
                document.getElementById('status-licenca').innerText = siteAtivo ? 'Desbloqueado' : 'Bloqueado';
                document.getElementById('total-clientes').innerText = Number(data.resumo?.totalClientes || 0);
                document.getElementById('total-concluidos').innerText = Number(data.resumo?.metasConcluidas || 0);

                const btn = document.getElementById('btn-bloqueio');
                if (siteAtivo) {
                    btn.innerText = 'Bloquear Site';
                    btn.className = 'btn-bloquear btn-full';
                } else {
                    btn.innerText = 'Desbloquear Site';
                    btn.className = 'btn-desbloquear btn-full';
                }

                renderizarClientes(Array.isArray(data.clientes) ? data.clientes : []);
            } catch (e) {
                document.getElementById('status-conexao').innerText = 'Offline';
            }
        }

        function renderizarClientes(clientes) {
            const container = document.getElementById('lista-clientes');
            if (!clientes.length) {
                container.innerHTML = '<p style="color:#cbb88a; font-size:13px; text-align:center;">Nenhum cliente cadastrado.</p>';
                return;
            }

            container.innerHTML = clientes.map(c => {
                const nome = String(c.nome || 'Cliente');
                const tel = String(c.telefone || '');
                const coracoes = Number(c.coracoes || 0);
                const max = Number(c.maxCoracoes || 7);

                return `
                    <div class="cliente-card">
                        <div class="cliente-topo">
                            <div>
                                <span class="cliente-nome">${escaparTexto(nome)}</span>
                                <span class="cliente-tel">${escaparTexto(tel)}</span>
                            </div>
                            <span class="cliente-coracoes">💛 ${coracoes}/${max}</span>
                        </div>
                        <div class="cliente-acoes">
                            <button type="button" class="btn-add" data-tel="${escaparTexto(tel)}" data-acao="adicionar">+ Coração</button>
                            <button type="button" class="btn-rem" data-tel="${escaparTexto(tel)}" data-acao="remover">- Coração</button>
                            <button type="button" class="btn-del" data-tel="${escaparTexto(tel)}" data-nome="${escaparTexto(nome)}" data-acao="deletar">Deletar</button>
                        </div>
                    </div>
                `;
            }).join('');

            container.querySelectorAll('button[data-acao]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const acao = btn.dataset.acao;
                    const tel = btn.dataset.tel;
                    const nome = btn.dataset.nome || 'este cliente';
                    if (acao === 'deletar') {
                        if (!confirm(`Deletar ${nome} (${tel})?`)) return;
                    }
                    manipularCliente(tel, acao);
                });
            });
        }

        async function manipularCliente(telefone, acao) {
            const msgAcao = document.getElementById('msg-acao');
            try {
                const res = await fetch('/api/mestre/cliente', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ senhaMestra: senhaSalva, telefone, acao })
                });
                const data = await res.json();
                if (data.sucesso) {
                    msgAcao.innerText = data.mensagem || 'Salvo.';
                    await carregarPainel();
                } else {
                    msgAcao.innerText = data.erro || 'Erro na ação.';
                }
            } catch (e) {
                msgAcao.innerText = 'Falha na comunicação.';
            }
        }

        async function alternarLicenca() {
            const msgAcao = document.getElementById('msg-acao');
            try {
                const res = await fetch('/api/mestre/alternar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ senhaMestra: senhaSalva, ativo: !siteAtivo })
                });
                const data = await res.json();
                if (data.sucesso) {
                    msgAcao.innerText = data.mensagem || 'Atualizado.';
                    await carregarPainel();
                } else {
                    msgAcao.innerText = data.erro || 'Erro ao atualizar.';
                }
            } catch (e) {
                msgAcao.innerText = 'Falha ao comunicar com o servidor.';
            }
        }
    </script>
</body>
</html>
