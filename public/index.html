<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Brendha Elias - Cartão Fidelidade</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            background: radial-gradient(circle at top, #1f1910 0%, #0b0b0d 75%);
            color: #f5e6c4;
            padding: 16px;
            margin: 0;
            min-height: 100vh;
        }
        .card {
            background: #141417;
            border: 1px solid rgba(212, 175, 55, 0.45);
            padding: 24px 20px;
            border-radius: 18px;
            width: 100%;
            max-width: 400px;
            margin: 16px auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65), 0 0 18px rgba(212, 175, 55, 0.12);
        }
        .logo-topo {
            width: 100%;
            max-width: 240px;
            height: auto;
            border-radius: 12px;
            margin: 0 auto 12px auto;
            display: block;
            border: 1px solid rgba(212, 175, 55, 0.35);
        }
        .studio-nome {
            margin: 4px 0 6px 0;
            font-size: 22px;
            color: #e5c158;
            letter-spacing: 0.5px;
        }
        .subtitulo {
            color: #cbb88a;
            font-size: 14px;
            margin: 0 0 16px 0;
        }
        .coracoes {
            font-size: 28px;
            margin: 18px 0;
            line-height: 1.5;
            word-spacing: 4px;
        }
        .ativo {
            color: #f5c136;
            text-shadow: 0 0 10px rgba(245, 193, 54, 0.45);
        }
        .inativo {
            color: #444038;
        }
        input {
            padding: 12px 14px;
            width: 100%;
            margin: 8px 0;
            font-size: 16px;
            background: #0d0d10;
            color: #fff;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 10px;
            outline: none;
        }
        input:focus {
            border-color: #f5c136;
        }
        button {
            width: 100%;
            padding: 12px 20px;
            background: linear-gradient(135deg, #d4af37, #f5d061, #b88b1e);
            color: #111;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
        }
        button:active {
            transform: scale(0.99);
        }
        #qrcode {
            margin: 18px auto;
            padding: 12px;
            background: #ffffff;
            border-radius: 12px;
            width: fit-content;
            display: flex;
            justify-content: center;
        }
        #status-premio {
            font-weight: bold;
            color: #f5d061;
            font-size: 15px;
            margin-top: 10px;
        }
        .aviso-bloqueio {
            color: #ef9a9a;
            background: rgba(198, 40, 40, 0.16);
            border: 1px solid rgba(198, 40, 40, 0.45);
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card" id="tela-bloqueio" style="display:none;">
        <img src="logo-brendha.jpg" alt="Studio Brendha Elias" class="logo-topo" onerror="this.style.display='none'">
        <h2 class="studio-nome">Studio Brendha Elias</h2>
        <div class="aviso-bloqueio">Acesso temporariamente suspenso.</div>
    </div>

    <div class="card" id="tela-cadastro">
        <img src="logo-brendha.jpg" alt="Studio Brendha Elias" class="logo-topo" onerror="this.style.display='none'">
        <h2 class="studio-nome">Studio Brendha Elias</h2>
        <p class="subtitulo">Digite seus dados para gerar ou ver seu cartão fidelidade:</p>
        <input type="text" id="nome-input" placeholder="Seu Nome">
        <input type="tel" id="tel-input" placeholder="Seu Telefone / WhatsApp">
        <button onclick="gerarCartao()">Criar / Ver Meu Cartão</button>
    </div>

    <div class="card" id="tela-cartao" style="display:none;">
        <img src="logo-brendha.jpg" alt="Studio Brendha Elias" class="logo-topo" onerror="this.style.display='none'">
        <h2 class="studio-nome">Studio Brendha Elias</h2>
        <p class="subtitulo">Cliente: <strong id="nome-exibir" style="color:#fff;"></strong></p>
        <p style="font-size: 13px; color: #cbb88a; margin: 0;">Apresente este QR Code no studio para ganhar seus corações!</p>

        <div id="qrcode"></div>

        <div class="coracoes" id="grid-coracoes"></div>
        <p id="status-premio"></p>
    </div>

    <script>
        const META_CORACOES = 7;
        let telefoneClienteAtual = "";
        let intervaloAtualizacao = null;
        let siteBloqueado = false;

        function aplicarEstadoBloqueio(bloqueado) {
            siteBloqueado = Boolean(bloqueado);
            const telaBloqueio = document.getElementById('tela-bloqueio');
            const telaCadastro = document.getElementById('tela-cadastro');
            const telaCartao = document.getElementById('tela-cartao');

            if (siteBloqueado) {
                telaBloqueio.style.display = 'block';
                telaCadastro.style.display = 'none';
                telaCartao.style.display = 'none';
            } else {
                telaBloqueio.style.display = 'none';
                if (!telefoneClienteAtual) {
                    telaCadastro.style.display = 'block';
                }
            }
        }

        async function verificarStatusSite() {
            try {
                const res = await fetch('/api/status');
                if (res.ok) {
                    const data = await res.json();
                    aplicarEstadoBloqueio(data.ativo === false);
                }
            } catch (e) {}
        }

        async function gerarCartao() {
            await verificarStatusSite();
            if (siteBloqueado) return;

            const nome = document.getElementById('nome-input').value.trim();
            const telefone = document.getElementById('tel-input').value.trim();

            if (!nome || !telefone) {
                alert('Por favor, preencha o nome e o telefone!');
                return;
            }

            telefoneClienteAtual = telefone;

            const res = await fetch('/api/cadastrar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, telefone })
            });

            if (res.status === 403) {
                aplicarEstadoBloqueio(true);
                return;
            }

            const data = await res.json();

            document.getElementById('tela-cadastro').style.display = 'none';
            document.getElementById('tela-cartao').style.display = 'block';
            document.getElementById('nome-exibir').innerText = data.nome || nome;

            atualizarVisualCartao(data);

            document.getElementById("qrcode").innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: String(data.telefone || telefone),
                width: 170,
                height: 170
            });

            iniciarAtualizacaoAutomatica();
        }

        function atualizarVisualCartao(data) {
            const coracoes = Number(data.coracoes || 0);
            const total = META_CORACOES;
            let html = '';

            for (let i = 0; i < total; i++) {
                if (i < coracoes) {
                    html += '<span class="ativo">💛</span>';
                } else {
                    html += '<span class="inativo">🤍</span>';
                }
            }
            document.getElementById('grid-coracoes').innerHTML = html;

            const statusEl = document.getElementById('status-premio');
            if (coracoes >= total) {
                statusEl.innerText = "parabéns, você completou seu cartão 🎉";
            } else {
                const faltam = total - coracoes;
                statusEl.innerText = `Faltam ${faltam} ${faltam === 1 ? 'coração' : 'corações'} para completar (${coracoes}/${total}).`;
            }
        }

        function iniciarAtualizacaoAutomatica() {
            if (!telefoneClienteAtual) return;
            if (intervaloAtualizacao) clearInterval(intervaloAtualizacao);

            intervaloAtualizacao = setInterval(async () => {
                try {
                    const res = await fetch(`/api/cliente/${encodeURIComponent(telefoneClienteAtual)}`);
                    if (res.status === 403) {
                        aplicarEstadoBloqueio(true);
                        return;
                    }
                    const data = await res.json();
                    aplicarEstadoBloqueio(false);
                    document.getElementById('tela-cartao').style.display = 'block';

                    if (data && data.coracoes !== undefined) {
                        atualizarVisualCartao(data);
                    }
                } catch (e) {}
            }, 2000);
        }

        verificarStatusSite();
    </script>
</body>
</html>
